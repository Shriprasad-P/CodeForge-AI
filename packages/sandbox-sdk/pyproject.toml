[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdock-sandbox-sdk"
version = "0.4.0"
description = "AgentDock sandbox provider interface and Docker implementation"
requires-python = ">=3.12"
dependencies = ["docker>=7.1.0"]

[tool.setuptools.packages.find]
include = ["sandbox_sdk*"]
