services:
  postgres:
    image: postgres:16-alpine
    container_name: agentdock-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentdock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentdock_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-agentdock}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentdock} -d ${POSTGRES_DB:-agentdock}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: agentdock-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: agentdock-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentdock}:${POSTGRES_PASSWORD:-agentdock_dev_password}@postgres:5432/${POSTGRES_DB:-agentdock}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      APP_ENV: ${APP_ENV:-development}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-me-agentdock-session-secret}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      SANDBOX_CHECKOUT_MODE: ${SANDBOX_CHECKOUT_MODE:-fixture}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_MODEL: ${LLM_MODEL:-fake}
    volumes:
      - ./.local-secrets:/run/secrets:ro
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: agentdock-worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentdock}:${POSTGRES_PASSWORD:-agentdock_dev_password}@postgres:5432/${POSTGRES_DB:-agentdock}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: ${APP_ENV:-development}
      SANDBOX_PROVIDER: docker
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-agentdock-sandbox:local}
      SANDBOX_CPU_LIMIT: ${SANDBOX_CPU_LIMIT:-1.0}
      SANDBOX_MEMORY_LIMIT: ${SANDBOX_MEMORY_LIMIT:-512m}
      SANDBOX_PIDS_LIMIT: ${SANDBOX_PIDS_LIMIT:-256}
      SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-120}
      SANDBOX_MAX_OUTPUT_BYTES: ${SANDBOX_MAX_OUTPUT_BYTES:-256000}
      SANDBOX_NETWORK_DISABLED: ${SANDBOX_NETWORK_DISABLED:-true}
      SANDBOX_CHECKOUT_MODE: ${SANDBOX_CHECKOUT_MODE:-fixture}
      SANDBOX_FIXTURE_REPO_PATH: /app/fixtures/sample-repo
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_MODEL: ${LLM_MODEL:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      # Control-plane only — never mounted into sandbox containers.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.local-secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: agentdock-web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
